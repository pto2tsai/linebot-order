<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#00408A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>崇文海鮮 下單</title>
<meta name="description" content="點開列出您常買的品項，選好數量按「送出」就好">
<meta property="og:title" content="崇文海鮮 下單">
<meta property="og:description" content="點開列出您常買的品項，選好數量按「送出」就好">
<meta property="og:image" content="https://pto2tsai.github.io/linebot-order/mascot.png">
<!--
  LINE 訂單助理的下單畫面（LIFF）。這個檔案沒有任何密碼或客戶資料：
  要連哪個後台（api）、哪個 LIFF（id）寫在 LINE Developers 的 Endpoint URL 後面，
  客人的品項是登入 LINE 之後向後台要的。原始檔在 pto2tsai/linebot 的 liff/index.html。
-->
<style>
  /* 崇文海鮮 CI：白底、品牌藍建立企業感、珊瑚色只用在提醒和行動重點 */
  :root { --blue:#0057B8; --blue-d:#00408A; --blue-l:#1C74DD; --coral:#F6745F; --coral-d:#e35f4a; --beige:#EEDFD5;
    --bg:#F7F9FC; --card:#fff; --ink:#0E1726; --sub:#5f6b7d; --line:#dfe5ee; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  header { background: #fff; color: var(--ink); padding: 10px 16px 10px; border-bottom: 3px solid var(--blue); display: flex; align-items: center; gap: 12px; }
  header img { height: 40px; width: auto; flex: none; }
  header .who { min-width: 0; }
  header h1 { margin: 0; font-size: 19px; color: var(--blue-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header p { margin: 1px 0 0; font-size: 13px; color: var(--sub); }
  /* 🔍 搜尋和篩選鍵同一排（蔡阿博 9/27） */
  .toolrow { display: flex; align-items: center; gap: 8px; padding: 0 10px 6px; max-width: 640px; margin: 0 auto; }
  .toolrow .search { flex: 0 0 34%; min-width: 0; font-size: 16px; padding: 9px 10px; border-radius: 99px; }
  .toolrow .chips { flex: 1; min-width: 0; margin-top: 0; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; margin-top: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; padding: 8px 16px; font-size: 16px; border-radius: 99px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .chips button.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .chips button.rec { border-color: var(--coral); color: var(--coral-d); font-weight: 700; }
  .chips button.rec.on { background: var(--coral); border-color: var(--coral); color: #fff; }
  textarea.note { width: 100%; min-height: 64px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; resize: vertical; }
  .st { font-size: 13px; padding: 2px 10px; border-radius: 99px; }
  .st.ship { background: #e6f4ea; color: #1e7b34; }
  .st.wait { background: #e8f1fb; color: var(--blue); }
  .done img { width: 150px; height: auto; display: block; margin: 0 auto 16px; }
  main { padding: 12px 12px 120px; max-width: 640px; margin: 0 auto; }
  .msg { text-align: center; padding: 48px 16px; color: var(--sub); }
  .msg.err { color: var(--coral-d); }
  h2 { font-size: 15px; color: var(--sub); margin: 18px 4px 8px; font-weight: 600; }
  .search { width: 100%; font-size: 17px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  /* 品名和數量同一行；規格用整行寬度、不折行（蔡阿博：規格折行不好讀） */
  .item { background: var(--card); border-radius: 14px; padding: 10px 12px 10px 14px; margin: 8px 0; border: 2px solid transparent;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name qty" "spec spec" "tag tag"; column-gap: 10px; align-items: center; }
  .item.on { border-color: var(--blue); }
  /* 修改時改過、新加的品項換珊瑚色框（蔡阿博 9/27：方便識別） */
  .item.chg { border-color: var(--coral); background: #fff8f6; }
  .item.off { opacity: .55; }
    .name { grid-area: name; font-weight: 700; font-size: 18px; line-height: 1.3; }
  .spec { grid-area: spec; color: var(--sub); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
  .tagrow { grid-area: tag; }
  .tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 99px; margin-top: 4px; }
  .tag.out { background: #fdeae6; color: var(--coral-d); }
  .tag.make { background: var(--beige); color: #7a5a44; }
  .tag.badge { background: #e8f1fb; color: var(--blue); margin-right: 6px; }
  .tag.was { background: #fff4d6; color: #8a6100; margin-right: 6px; }
  .tag.drop { background: #fdeae6; color: var(--coral-d); margin-right: 6px; }
  .item.gone { opacity: .6; }
  .hint { font-size: 15px; color: var(--sub); padding: 4px 4px 0; }
  .qty { grid-area: qty; display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .qty button { width: 48px; height: 48px; border: 0; font-size: 26px; font-weight: 700; background: #fff; color: var(--blue); }
  .qty button.plus { background: var(--blue); color: #fff; }
  .qty button:disabled { opacity: .35; }
  .qty input { width: 56px; height: 48px; text-align: center; font-size: 20px; font-weight: 700; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0; color: var(--ink); }
  .unit { font-size: 14px; color: var(--sub); }
  /* 到貨日固定在上面（蔡阿博 9/27：不用滑到最下面才能選；v0928-X 改成希望到貨日） */
  /* 最近 4 天（截單前含今天）＋第 5 格自己指定日期（蔡阿博 9/27） */
  .duebar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 6px 10px 8px; max-width: 640px; margin: 0 auto; }
  .duebar .lab { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--sub); }
  .duebar button, .duebar .pick { position: relative; min-width: 0; padding: 7px 0; font-size: 15px; line-height: 1.25; text-align: center; white-space: nowrap; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-family: inherit; }
  .duebar .pick { border-style: dashed; color: var(--blue); font-weight: 700; }
  .duebar .pick.on { border-style: solid; border-color: var(--blue); background: #e8f1fb; color: var(--blue-d); }
  .duebar .pick.moved { border-style: solid; border-color: var(--coral); background: #fdeae6; color: var(--coral-d); }
  .duebar .pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0; }
  .duebar button.on { border-color: var(--blue); background: #e8f1fb; color: var(--blue-d); font-weight: 700; }
  .duebar button.moved { border-color: var(--coral); background: #fdeae6; color: var(--coral-d); }
  .duebar .was { display: block; font-size: 11px; font-weight: 400; color: var(--sub); line-height: 1.1; overflow: hidden; text-overflow: ellipsis; }
  .duebar button.has:not(.on) { background: #f3f7fc; }
  .duebar button:disabled { opacity: .35; }
  .ordbox { background: #fff; border: 2px solid var(--blue); border-radius: 14px; padding: 12px 14px; margin: 4px 0 10px; font-size: 16px; }
  .ordbox .sub { color: var(--sub); font-size: 14px; margin-top: 2px; }
  .ordbox .top1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ordbox .no { color: var(--sub); font-size: 14px; }
  .ordbox .to { color: var(--coral-d); }
  .ordbox .tip { flex: none; font-size: 13px; color: var(--sub); white-space: nowrap; }
  .sheet .alt { width: 100%; max-width: 640px; display: block; margin: 10px auto 0; height: 52px; border: 2px solid var(--blue); border-radius: 14px; background: #fff; font-size: 18px; font-weight: 700; color: var(--blue); }
  h2 .h2tip { float: right; font-size: 13px; font-weight: 400; color: var(--sub); margin-top: 2px; }
  .ordbox button { flex: none; padding: 8px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--blue); background: #fff; color: var(--blue); font-weight: 700; }
  .hist { background: #fff; border-radius: 14px; padding: 10px 14px; margin: 8px 0; }
  .hist.cur { border: 2px solid var(--blue); }
  .hist .hh { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .hist .no { color: var(--sub); font-size: 13px; }
  .hist .st { margin-left: auto; }
  .hist .go2 { padding: 6px 12px; font-size: 14px; border-radius: 10px; border: 0; background: var(--blue); color: #fff; font-weight: 700; }
  .hist .hl { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; padding: 3px 0; border-top: 1px dashed var(--line); }
  .hist .hl span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist .hl b { flex: none; }
  .hist .sub { color: var(--sub); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); z-index: 6; }
  .bar button, .sheet .go { width: 100%; max-width: 640px; display: block; margin: 0 auto; height: 56px; border: 0; border-radius: 14px; font-size: 20px; font-weight: 700; background: var(--coral); color: #fff; }
  .bar button:disabled { background: #c9ccd1; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; }
  .sheet { background: #fff; width: 100%; border-radius: 18px 18px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
  .sheet h3 { margin: 0 0 10px; font-size: 20px; }
  .sheet ol { margin: 0 0 8px; padding-left: 22px; font-size: 17px; }
  .sheet ol li { margin: 4px 0; }
  .sheet .due { font-weight: 700; margin: 8px 0 14px; }
  .sheet .back { width: 100%; max-width: 640px; display: block; margin: 10px auto 0; height: 48px; border: 0; background: none; font-size: 17px; color: var(--sub); }
  .done { text-align: center; padding: 40px 16px; font-size: 24px; font-weight: 700; color: var(--blue-d); }
</style>
</head>
<body>
<div class="top"><header><img src="logo.png" alt="崇文海鮮 WENS SEAFOOD"><div class="who"><h1 id="title">下單</h1><p id="subtitle"></p></div></header>
<div class="duebar" id="dueBar" hidden></div>
<div class="toolrow" id="searchWrap" hidden><input class="search" id="search" type="search" placeholder="🔍 找品項" autocomplete="off" enterkeyhint="search"><div class="chips" id="chips"></div></div></div>
<main>
<div id="app"><div class="msg">請稍等，正在讀取您常買的品項</div></div></main>
<div class="bar" id="bar" hidden><button id="send" disabled></button></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
(function () {
  'use strict';
  // v0928-R 同一個畫面（蔡阿博 9/27）：選出貨日 → 那天沒單就下單、有單就帶出來改（件數、出貨日）；下面看這個月＋上個月的單
  var params0 = new URLSearchParams(location.search);
  var API = params0.get('api') || '';
  var LIFF_ID = params0.get('id') || '';
  var state = { g: '', items: [], dues: [], range: null, earliest: '', orders: [], history: [], due: '', moveTo: '',
    qty: {}, orig: {}, filter: '', cat: '', note: '' };
  // 分類：品名有這些字就歸這一類；兩類以上才顯示分類按鈕
  var CATS = [['白蝦', /白蝦/], ['草蝦', /草蝦/], ['透抽／小卷', /透抽|小卷|冰卷|中卷/], ['鮭魚', /鮭/], ['魷魚', /魷/], ['干貝／扇貝', /干貝|扇貝/], ['鯛魚', /鯛/]];
  var REC = '⭐ 推薦';
  function catOf(it) { for (var i = 0; i < CATS.length; i++) if (CATS[i][1].test(it.name)) return CATS[i][0]; return '其他'; }
  var app = document.getElementById('app');
  var bar = document.getElementById('bar');
  var sendBtn = document.getElementById('send');
  var dueBar = document.getElementById('dueBar');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function show(html) { app.innerHTML = html; }
  function fail(text) { bar.hidden = true; dueBar.hidden = true; document.getElementById('searchWrap').hidden = true; document.getElementById('subtitle').textContent = ''; show('<div class="msg err">' + esc(text) + '</div>'); }

  function call(body) {
    body.idToken = liff.getIDToken();
    body.g = state.g;
    // 用 text/plain 送，Apps Script 才不會擋（不會多一次預檢）
    return fetch(API, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function orderOf(due) { return state.orders.filter(function (o) { return o.due === due; })[0] || null; }
  function cur() { return orderOf(state.due); }                     // 這天已經有的單（沒有＝下新單）
  var WD = '日一二三四五六';
  function dueLabel(v) {
    var p = String(v || '').split('-');
    if (p.length !== 3) return '';
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return Number(p[1]) + '/' + Number(p[2]) + '(' + WD.charAt(d.getDay()) + ')';
  }
  function inButtons(v) { return state.dues.some(function (d) { return d.value === v; }); }
  /** 最後一格自己選的日期（到貨日，v0928-X）：最快到貨日以後、不是星期天或放假、60 天內 */
  function dueOk(v) {
    var r = state.range;
    if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(v) || v < r.min || v > r.max) return false;
    var p = v.split('-');
    if ((r.blocked || []).indexOf(v) !== -1) return false;
    return (r.noArrive || r.noShip || []).indexOf(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay()) === -1;
  }
  function picked() { return state.items.filter(function (it) { return (state.qty[it.code] || 0) > 0; }); }
  function changes() {
    return state.items.map(function (it) { return { it: it, q: state.qty[it.code] || 0, cur: state.orig[it.code] || 0 }; })
      .filter(function (x) { return x.q !== x.cur; });
  }
  function dirty() { return cur() ? changes().length > 0 || !!state.moveTo : picked().length > 0; }

  /** 選出貨日：那天有單就帶出原本的件數 */
  function select(due, ask) {
    // 下新單時換日期：選好的品項留著（蔡阿博 9/27：換日期不要清掉）；換到已經有單的那天 → 問要不要加進那天的單
    var keep = {};
    if (ask && !cur() && due !== state.due) {
      picked().forEach(function (it) { keep[it.code] = state.qty[it.code]; });
      if (Object.keys(keep).length && orderOf(due) && !confirm(dueLabel(due) + ' 已經有單了，剛選的品項要加進那天的單嗎？')) return;
    } else if (ask && due !== state.due && dirty() && !confirm('剛剛改的還沒送出，換到別天會清掉，確定嗎？')) return;
    state.due = due; state.moveTo = '';
    if (!Object.keys(keep).length) state.note = '';
    state.orig = {}; state.qty = {};
    var o = cur();
    if (o) Object.keys(o.items).forEach(function (c) { state.orig[c] = o.items[c]; state.qty[c] = o.items[c]; });
    Object.keys(keep).forEach(function (c) { state.qty[c] = Math.min(9999, (state.qty[c] || 0) + keep[c]); });
    render();
  }

  function subOf(v) {
    var o = orderOf(v);
    return v === state.moveTo ? '改到這天' : (v === state.due && state.moveTo) ? '原本' : o ? '已下' + Object.keys(o.items).length + '項'
      : (state.earliest && v < state.earliest) ? '需確認' : '';   // 比平常最快的早：業務會聯絡確認（v0929-A）
  }
  function renderDues() {
    dueBar.hidden = !state.dues.length;
    var html = '<span class="lab">希望到貨日</span>' + state.dues.map(function (d) {
      var o = orderOf(d.value);
      var isCur = d.value === state.due, isTo = d.value === state.moveTo;
      var sub = subOf(d.value);
      return '<button data-due="' + esc(d.value) + '" class="' + ((isCur && !state.moveTo) ? 'on' : '') + (isTo ? ' on moved' : '') + (o ? ' has' : '') + '"'
        + '>' + esc(d.label) + (sub ? '<span class="was">' + esc(sub) + '</span>' : '') + '</button>';
    }).join('');
    // 最後一格：不在這 4 天的日期（自己選的、或是那天本來就有單）
    var v6 = state.moveTo && !inButtons(state.moveTo) ? state.moveTo : !inButtons(state.due) ? state.due : '';
    var cls = !v6 ? '' : v6 === state.moveTo ? ' moved' : state.moveTo ? '' : ' on';
    var r = state.range || {};
    html += '<label class="pick' + cls + '">' + (v6 ? esc(dueLabel(v6)) + '<span class="was">' + esc(subOf(v6) || '指定') + '</span>' : '📅 指定<span class="was">其他日期</span>')
      + '<input type="date" id="pickDate" aria-label="指定到貨日" min="' + esc(r.min || '') + '" max="' + esc(r.max || '') + '" value="' + esc(v6 || '') + '"></label>';
    dueBar.innerHTML = html;
  }

  function itemCls(code) {
    var q = state.qty[code] || 0, c0 = state.orig[code] || 0;
    return (q ? ' on' : '') + (cur() && q && q !== c0 ? ' chg' : '') + (c0 && !q ? ' gone' : '');
  }

  /** 點日期（蔡阿博 9/27：改件數後點別天＝一起改日期，不要清掉） */
  function goDate(v) {
    var o = cur();
    if (o && v === state.due) { if (state.moveTo) { state.moveTo = ''; render(); } return; }   // 點回原本那天＝不改日期
    if (!o || orderOf(v)) { select(v, true); return; }
    if (v === state.moveTo) return;
    askMove(v);
  }
  function askMove(v) {
    var mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML = '<div class="sheet"><h3>' + esc(dueLabel(v)) + ' 要怎麼做？</h3>'
      + '<button class="go" id="mvGo">把 ' + esc(dueLabel(state.due)) + ' 的單改到這天</button>'
      + (dirty() ? '<div class="hint" style="text-align:center">剛改的件數會一起保留</div>' : '')
      + '<button class="alt" id="mvNew">這天另外下一張新單</button>'
      + '<button class="back" id="mvNo">取消</button></div>';
    document.body.appendChild(mask);
    document.getElementById('mvGo').onclick = function () { mask.remove(); state.moveTo = v; render(); };
    document.getElementById('mvNew').onclick = function () { mask.remove(); select(v, true); };
    document.getElementById('mvNo').onclick = function () { mask.remove(); renderDues(); };
    mask.addEventListener('click', function (e) { if (e.target === mask) { mask.remove(); renderDues(); } });
  }

  function itemHtml(it) {
    var q = state.qty[it.code] || 0;
    var c0 = state.orig[it.code] || 0;
    var out = it.stock === '缺貨' && !c0;   // 單上本來就有的，缺貨也能改少
    var tags = (c0 && !q ? '<span class="tag drop">不要了</span>' : c0 && q !== c0 ? '<span class="tag was">原本 ' + c0 + esc(it.unit) + '</span>' : '')
      + (it.badge ? '<span class="tag badge">' + esc(it.badge) + '</span>' : '')
      + (out ? '<span class="tag out">缺貨</span>' : it.stock === '安排生產' ? '<span class="tag make">等待產出</span>' : '');
    return '<div class="item' + itemCls(it.code) + (out ? ' off' : '') + '">'
      + '<div class="name">' + esc(it.name) + '</div><div class="spec" title="' + esc(it.spec) + '">' + esc(it.spec) + '</div>'
      + (tags ? '<div class="tagrow">' + tags + '</div>' : '')
      + (out ? '' : '<div class="qty"><button class="minus" data-c="' + esc(it.code) + '" data-d="-1"' + (q ? '' : ' disabled') + ' aria-label="減少">−</button>'
        + '<input inputmode="numeric" pattern="[0-9]*" data-c="' + esc(it.code) + '" value="' + (q || '') + '" placeholder="0" aria-label="數量">'
        + '<button class="plus" data-c="' + esc(it.code) + '" data-d="1" aria-label="增加">＋</button></div>')
      + '</div>';
  }

  function historyHtml() {
    if (!state.history.length) return '';
    return '<h2>歷史訂單</h2>' + state.history.map(function (o) {
      return '<div class="hist' + (o.due === state.due ? ' cur' : '') + '"><div class="hh"><b>' + esc(o.label) + ' 到</b>'
        + (o.no ? '<span class="no">#' + esc(o.no) + '</span>' : '')
        + '<span class="st ' + (o.shipped ? 'ship' : 'wait') + '">' + (o.shipped ? '已出貨' : '處理中') + '</span>'
        + (o.editable && o.due !== state.due ? '<button class="go2" data-pick="' + esc(o.due) + '">改這張</button>' : '') + '</div>'
        + o.lines.map(function (x) { return '<div class="hl"><span>' + esc(x.name) + ' ' + esc(x.spec) + '</span><b>' + x.qty + esc(x.unit) + '</b></div>'; }).join('')
        + (o.other ? '<div class="hl sub">另有 ' + o.other + ' 項業務確認中</div>' : '') + '</div>';
    }).join('');
  }

  function render() {
    var o = cur();
    document.getElementById('subtitle').textContent = o ? '修改這天的單' : '選到貨日、選數量，按「送出」';
    var f = state.filter.trim();
    var html = '';
    if (o) {
      // 蔡阿博 9/27：說明放到「這天的品項」右邊；「改到別天」改叫「修改日期」
      // 蔡阿博 9/27：藍框簡單就好，一行
      html += '<div class="ordbox"><div class="top1"><div><b>'
        + (state.moveTo ? esc(dueLabel(state.due)) + ' → <span class="to">' + esc(dueLabel(state.moveTo)) + '</span>'
          : esc(dueLabel(state.due)) + ' 的單')
        + '</b>' + (o.no ? ' <span class="no">#' + esc(o.no) + '</span>' : '') + '</div>'
        + (state.moveTo ? '<button data-act="unmove">不改日期</button>' : '<span class="tip">改日期：點上面日期</span>') + '</div></div>';
    }
    var cats = [];
    state.items.forEach(function (it) { if (it.sec === 'old') return; var c = catOf(it); if (cats.indexOf(c) === -1) cats.push(c); });
    cats.sort(function (a, b) { return (a === '其他') - (b === '其他'); });
    // 有推薦品項就多一顆「⭐ 推薦」（蔡阿博 9/28：推薦也要能一鍵篩選）
    var hasRec = state.items.some(function (it) { return it.sec === 'rec'; });
    var chips = document.getElementById('chips');
    var chipsHtml = ['全部'].concat(hasRec ? [REC] : []).concat(cats.length > 1 ? cats : []).map(function (c) {
      var on = !f && (c === '全部' ? '' : c) === state.cat;
      return '<button data-cat="' + esc(c === '全部' ? '' : c) + '" class="' + (on ? 'on' : '') + (c === REC ? ' rec' : '') + '">' + esc(c) + '</button>';
    }).join('');
    if (chips.innerHTML !== chipsHtml) chips.innerHTML = chipsHtml;   // 沒變就不重畫（捲到一半不會跳回去）
    // 這天的品項在最上面，再來常購（含「新增」）、推薦品項（v0928-N）
    var shown = 0;
    [['order', '這天的品項'], ['usual', '您常買的品項'], ['rec', '⭐ 推薦品項'], ['old', '以前買過']].forEach(function (sec) {
      var part = '';
      state.items.forEach(function (it) {
        var sc = state.orig[it.code] ? 'order' : (it.sec || 'usual');
        if (sc !== sec[0]) return;
        if (sc === 'old' && !f && !state.qty[it.code]) return;   // 以前買過的：搜尋時才出現（選了就留著）
        if (f && (it.name + it.spec).indexOf(f) === -1) return;
        if (!f && state.cat === REC && it.sec !== 'rec') return;
        if (!f && state.cat && state.cat !== REC && catOf(it) !== state.cat) return;   // 有打字搜尋就找全部，不管分類
        shown++;
        part += itemHtml(it);
      });
      if (part) html += '<h2>' + sec[1] + (sec[0] === 'order' ? '<span class="h2tip">改件數、減到 0＝不要了</span>' : '') + '</h2>' + part;
      if (sec[0] === 'order' && o && o.other && !f) html += '<div class="hint">這天還有 ' + o.other + ' 項業務確認中，要改請在群組打字</div>';
    });
    if (!shown) html += '<div class="msg">' + (f ? '找不到「' + esc(f) + '」<br>沒買過的品項，請直接在群組打字' : '還沒有常買的品項，請直接在群組打字下單') + '</div>';
    html += '<h2>備註（選填）</h2><textarea class="note" id="note" maxlength="100" placeholder="例如：特殊包裝、送貨時段…">' + esc(state.note) + '</textarea>';
    html += historyHtml();
    show(html);
    updateBar();
  }

  function updateBar() {
    renderDues();
    bar.hidden = false;
    if (cur()) {
      var k = changes().length + (state.moveTo ? 1 : 0);
      sendBtn.disabled = !k;
      sendBtn.textContent = k ? '送出修改（' + k + ' 項）' : '這天的單還沒有修改';
      return;
    }
    var n = picked().length;
    sendBtn.disabled = !n;
    sendBtn.textContent = n ? '送出（' + n + ' 項）' : '請選擇品項';
  }

  dueBar.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id !== 'pickDate' || !t.value) return;
    var v = t.value;
    if (!dueOk(v)) { alert('這天不能到貨（星期天和國定假日物流不送，最遠可以選到 ' + dueLabel(state.range.max) + '），請選別天'); renderDues(); return; }
    goDate(v);
  });
  dueBar.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.due || b.disabled) return;
    goDate(b.dataset.due);
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.pick) { select(b.dataset.pick, true); window.scrollTo(0, 0); return; }
    if (b.dataset.act === 'unmove') { state.moveTo = ''; render(); return; }
    if (b.dataset.cat !== undefined) { state.cat = b.dataset.cat; render(); return; }
    var c = b.dataset.c;
    if (!c) return;
    state.qty[c] = Math.max(0, Math.min(9999, (state.qty[c] || 0) + Number(b.dataset.d)));
    render();
  });
  // 篩選鍵在搜尋框旁邊：點了就清掉搜尋字
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.dataset.cat === undefined) return;
    state.cat = b.dataset.cat;
    if (searchBox.value) { searchBox.value = ''; state.filter = ''; }
    render();
    window.scrollTo(0, 0);   // 從清單最上面開始看
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'note') { state.note = t.value; return; }
    if (t.dataset.c) {
      var q = parseInt(String(t.value).replace(/[^0-9]/g, ''), 10) || 0;
      state.qty[t.dataset.c] = Math.min(9999, q);
      var box = t.closest('.item');
      ['on', 'chg', 'gone'].forEach(function (k) { box.classList.remove(k); });
      itemCls(t.dataset.c).split(' ').filter(String).forEach(function (k) { box.classList.add(k); });
      var minus = t.parentNode.querySelector('.minus');
      if (minus) minus.disabled = !q;
      updateBar();
    }
  });

  // 搜尋框放在清單外面、不跟著重畫；注音／倉頡選字中（composition）不搜尋，選好字才找（9/28 測試群：打出「ㄅㄅㄞㄞ」）
  var searchBox = document.getElementById('search');
  var composing = false;
  function doSearch() { state.filter = searchBox.value; render(); }
  searchBox.addEventListener('compositionstart', function () { composing = true; });
  searchBox.addEventListener('compositionend', function () { composing = false; doSearch(); });
  searchBox.addEventListener('input', function (e) { if (composing || e.isComposing) return; doSearch(); });

  // 按兩次才送出：先看一次明細
  sendBtn.addEventListener('click', function () {
    var o = cur();
    var edit = !!o;
    var list = edit ? changes() : picked();
    if (!list.length && !state.moveTo) return;
    var mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML = '<div class="sheet"><h3>' + (edit ? '確認修改' + (o.no ? ' #' + esc(o.no) : '') : '確認訂單') + '</h3><ol>' + (list.length ? '' : '<li>品項、件數不變</li>') + list.map(function (x) {
      if (!edit) return '<li>' + esc(x.name) + ' ' + esc(x.spec) + '　<b>' + state.qty[x.code] + esc(x.unit) + '</b></li>';
      var u = esc(x.it.unit);
      var what = !x.q ? '<b style="color:#e35f4a">不要了</b>' : !x.cur ? '<b>' + x.q + u + '</b>（新增）' : x.cur + u + ' → <b>' + x.q + u + '</b>';
      return '<li>' + esc(x.it.name) + ' ' + esc(x.it.spec) + '　' + what + '</li>';
    }).join('') + '</ol><div class="due">到貨日：' + esc(dueLabel(state.due))
      + (state.moveTo ? ' → <span style="color:#e35f4a">' + esc(dueLabel(state.moveTo)) + '</span>' : '') + '</div>'
      + (state.note.trim() ? '<div class="due" style="font-weight:400">備註：' + esc(state.note.trim()) + '</div>' : '')
      + '<button class="go" id="go">' + (edit ? '確定修改' : '確定送出') + '</button><button class="back" id="back">再改一下</button></div>';
    document.body.appendChild(mask);
    document.getElementById('back').onclick = function () { mask.remove(); };
    mask.addEventListener('click', function (e) { if (e.target === mask) mask.remove(); });
    document.getElementById('go').onclick = function () {
      var go = this;
      go.disabled = true; go.textContent = '送出中…';
      call({ liff: 'submit', mode: edit ? 'edit' : '', due: state.due, newDue: edit ? state.moveTo : '', note: state.note, items: list.map(function (x) {
        return edit ? { code: x.it.code, qty: x.q } : { code: x.code, qty: state.qty[x.code] };
      }) })
        .then(function (r) {
          if (!r.ok) throw new Error(r.error || '送出失敗');
          return liff.sendMessages([{ type: 'text', text: r.text }]);
        })
        .then(function () {
          mask.remove(); bar.hidden = true; dueBar.hidden = true;
          show('<div class="done"><img src="mascot.png" alt="">✅ ' + (edit ? '修改' : '訂單') + '已送出！<br><span style="font-size:16px;font-weight:400;color:#5f6b7d">小幫手會在群組回覆確認</span></div>');
          setTimeout(function () { try { liff.closeWindow(); } catch (e) {} }, 1200);
        })
        .catch(function (err) {
          go.disabled = false; go.textContent = edit ? '確定修改' : '確定送出';
          var m = String(err && err.message || err);
          if (/sendMessages|permission|context|chat/i.test(m) || (err && err.code)) m = '請從 LINE 群組裡的下單連結打開，才能把訂單傳到群組';
          alert(m);
        });
    };
  });

  function start() {
    if (!API || !LIFF_ID || typeof liff === 'undefined') { fail('下單畫面設定不完整，請跟業務說'); return; }
    liff.init({ liffId: LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      var qs = new URLSearchParams(location.search);
      state.g = qs.get('g') || '';
      if (!state.g) { fail('請從 LINE 群組裡的下單連結打開'); return; }
      return call({ liff: 'list' }).then(function (r) {
        if (!r.ok) { fail(r.error || '讀不到資料'); return; }
        state.items = r.items || [];
        state.dues = r.dues || [];
        state.range = r.range || null;
        state.earliest = r.earliest || '';
        state.orders = r.orders || [];
        state.history = r.history || [];
        document.getElementById('searchWrap').hidden = false;
        document.getElementById('title').textContent = (r.customer ? r.customer + ' ' : '') + '下單';
        // 按〔修改〕進來 → 選最近下的那張；一般 → 最近的出貨日（那天有單就帶出來）
        var normal = state.dues.filter(function (d) { return !state.earliest || d.value >= state.earliest; })[0];
        var first = qs.get('m') === 'edit' && r.latest ? r.latest : (normal ? normal.value : (state.dues.length ? state.dues[0].value : ''));
        select(first, false);
      });
    }).catch(function (err) { fail('打不開：' + (err && err.message || err) + '，請關掉重新打開'); });
  }
  start();
})();
</script>
</body>
</html>
