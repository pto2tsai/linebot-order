<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重量核對</title>
<link rel="apple-touch-icon" href="icon-weigh.png">
<link rel="icon" type="image/png" href="icon-weigh.png">
<meta name="robots" content="noindex">
<style>body{margin:0;font:18px sans-serif;color:#1d4aae;display:flex;align-items:center;justify-content:center;height:100vh;background:#fff}</style>
</head>
<body>
<p id="m">開啟中…</p>
<script>
  // 手機桌面用的入口（崇文 Logo）：Apps Script 的網頁 iPhone 加到主畫面讀不到自己的圖示，所以先開這一頁再跳過去。
  // 網址不寫在這裡（系統任何人拿到網址都能用），放在連結的「#」後面，只存在各人手機的桌面捷徑裡。
  var id = decodeURIComponent((location.hash || '').slice(1));
  if (/^AKfy[A-Za-z0-9_-]{20,}$/.test(id)) location.replace('https://script.google.com/macros/s/' + id + '/exec');
  else document.getElementById('m').textContent = '連結不完整，請跟管理者要正確的連結';
</script>
</body>
</html>
